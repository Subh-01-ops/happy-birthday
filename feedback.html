<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback | Subh</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html">Subh</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="feedback.html" class="active">Feedback</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero small">
      <h1>Feedback</h1>
      <p>Share your feedback using this dummy form.</p>
    </section>

    <section class="card">
      <form class="feedback-form" action="#" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your feedback"></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Subh. All rights reserved.</p>
  </footer>
</body>
</html>
